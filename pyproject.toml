[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-agent"
version = "1.0.0"
description = "Variable-level traceability checker for CDISC SDTM/ADaM submissions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Giri" }]
keywords = ["cdisc", "sdtm", "adam", "define-xml", "clinical", "traceability", "fda", "pharma"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "lxml>=5.0",
    "pyreadstat>=1.2",
    "pandas>=2.0",
]

[project.scripts]
trace-agent = "trace:main"

[project.urls]
Homepage = "https://github.com/giri/trace-agent"

[tool.setuptools]
py-modules = ["trace"]
